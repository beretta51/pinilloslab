<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pinillos Lab</title>
<meta name="robots" content="noindex,follow">
<style>
  html, body { margin: 0; padding: 0; background: #F2EFE6; color: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  .wrap { text-align: center; padding: 32px; }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { font-size: 14px; color: #6E6E6E; margin: 0; }
  a { color: #0A0A0A; text-decoration: underline; }
</style>
<script>
  // GitHub Pages shows this page for any address that isn't a real file.
  (function () {
    // Trovelo moved to troveloapp.com: unknown /trovelo/… addresses go there
    // (its Publisher pages stay here and are real files, so they never land here).
    var t = window.location.pathname.match(/^\/trovelo(\/.*)?$/);
    if (t) {
      window.location.replace('https://troveloapp.com' + (t[1] || '/') + window.location.search + window.location.hash);
      return;
    }
    // Everything else: an address that starts with a room's name goes to that room of the walk
    // (/dimmly/whatever → /#dimmly); anything unknown goes home.
    var seg = window.location.pathname.split('/')[1] || '';
    var rooms = ['dimmly', 'percha', 'solid', 'gridborne', 'dummo', 'takekit', 'about', 'contact'];
    window.location.replace(rooms.indexOf(seg) >= 0 ? '/#' + seg : '/');
  })();
</script>
</head>
<body>
  <noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
  <div class="wrap">
    <h1>Redirecting…</h1>
    <p>If you aren't redirected, <a href="/">go to the homepage</a>.</p>
  </div>
</body>
</html>
